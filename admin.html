<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENITH ADMIN 2026/2027</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300&display=swap" rel="stylesheet"><style>body{background:#070507;color:#e9dcc6;font-family:'Inter',sans-serif}h1,h2,h3{font-family:'Cormorant Garamond',serif;letter-spacing:.18em}.gold{color:#d7b77a}.inp{background:#111;border:1px solid #2a2420;color:#fff;padding:12px;width:100%;margin-top:8px;font-size:13px}.btn-gold{background:#d7b77a;color:#000;padding:12px;width:100%;font-weight:700;letter-spacing:.12em;margin-top:8px}.btn-dark{background:#1a1a1a;color:#d7b77a;border:1px solid #d7b77a;padding:10px;width:100%;margin-top:6px}.video-wrap{position:relative;height:280px;overflow:hidden;border:1px solid #1a1818}.video-wrap video{width:100%;height:100%;object-fit:cover;opacity:.6}.video-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(0,0,0,.2), #070507);display:flex;flex-direction:column;align-items:center;justify-content:center}.card{background:#111;border:1px solid #222;padding:12px;margin-top:10px;border-radius:6px}</style></head><body><div style="max-width:540px;margin:auto;padding:0 16px 24px;text-align:center"><div class="video-wrap"><video autoplay muted loop playsinline><source src="https://videos.pexels.com/video-files/18069234/18069234-uhd_1440_1440_24fps.mp4" type="video/mp4"></video><div class="video-overlay"><p style="font-size:10px;letter-spacing:.3em">ZENITH <span style="border:1px solid #444;padding:2px 8px;margin-left:6px">ADMIN</span></p><h1 style="font-size:28px;margin-top:12px;line-height:1.1">MODEL CONTEST<br>2026/2027</h1><p style="font-size:9px;opacity:.5;margin-top:6px">BTC Permanent: bc1q4h7...fun4 NEVER CHANGES</p></div></div>

<div style="margin-top:16px;border:1px solid #d7b77a;padding:16px;background:#0c0a0c;text-align:left"><h3 style="color:#d7b77a;font-size:14px">1. ADD CONTESTANT + UPLOAD PICTURE</h3><input id="name" placeholder="Name e.g. Saya Wifey" class="inp"><input id="code" placeholder="Code e.g. Saya463 (unique)" class="inp"><input id="cat" placeholder="Category e.g. Japanese - Runway" class="inp"><p style="font-size:10px;margin-top:10px;opacity:.6">📸 Upload Picture from phone:</p><input id="imgFile" type="file" accept="image/*" class="inp"><img id="preview" style="display:none;height:180px;margin-top:8px;border:1px solid #333;object-fit:cover;width:100%"><p style="font-size:9px;opacity:.4;text-align:center;margin:8px 0">OR paste Image URL</p><input id="imgUrl" placeholder="https://..." class="inp"><button onclick="addContestant()" class="btn-gold">+ ADD CONTESTANT</button></div>

<div style="margin-top:16px;border:1px solid #333;padding:16px;background:#0c0a0c;text-align:left"><h3 style="font-size:14px">2. SEARCH & INCREASE VOTES</h3><input id="searchCode" placeholder="Enter Code e.g. Saya463" class="inp"><button onclick="search()" class="btn-dark">🔍 SEARCH CODE</button><div id="found" style="display:none" class="card"><img id="fImg" style="height:260px;width:100%"><p id="fName" style="margin-top:8px;font-weight:700;font-size:16px"></p><p id="fCode" style="font-size:11px;opacity:.6"></p><p style="margin-top:10px">Current Votes: <span id="fVotes" style="color:#d7b77a;font-size:28px;font-weight:700">0</span> = $<span id="fTotal">0</span></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="addVotes(1)" class="btn-dark">+1 VOTE ($25)</button><button onclick="addVotes(2)" class="btn-dark">+2 ($50)</button><button onclick="addVotes(5)" class="btn-gold">+5 ($125)</button><button onclick="addVotes(10)" class="btn-gold">+10 ($250)</button></div><input id="customVotes" type="number" placeholder="Custom qty e.g. 3" class="inp"><button onclick="addCustom()" class="btn-gold">+ ADD CUSTOM</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><button onclick="resetVotes()" style="background:#300;color:#fff;padding:8px;font-size:11px">RESET TO 0</button><button onclick="deleteContestant()" style="background:#500;color:#fff;padding:8px;font-size:11px">DELETE</button></div></div></div>

<div style="margin-top:16px;text-align:left"><h3 style="font-size:11px;opacity:.5;letter-spacing:.2em">ALL CONTESTANTS</h3><div id="list"></div></div>

</div><script>function getModels(){return JSON.parse(localStorage.getItem('zenith_models_v3')||'null')||{"SAYA463":{name:"SAYA WIFEY",code:"Saya463",cat:"Japanese - Runway Contestant",votes:0,img:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600"}}}function saveModels(m){localStorage.setItem('zenith_models_v3',JSON.stringify(m));render();}let uploadedBase64=null;document.getElementById('imgFile').addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=function(ev){uploadedBase64=ev.target.result;document.getElementById('preview').src=uploadedBase64;document.getElementById('preview').style.display='block';};reader.readAsDataURL(file);});function addContestant(){let name=document.getElementById('name').value.trim();let code=document.getElementById('code').value.trim();let cat=document.getElementById('cat').value.trim();let imgUrl=document.getElementById('imgUrl').value.trim();if(!name||!code){alert('Enter Name and Code');return;}let finalImg=uploadedBase64||imgUrl||"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600";let models=getModels();let key=code.toUpperCase().replace("-","");models[key]={name:name,code:code,cat:cat||"Runway Contestant",votes:0,img:finalImg};saveModels(models);alert('Added '+code);document.getElementById('name').value='';document.getElementById('code').value='';document.getElementById('cat').value='';document.getElementById('imgUrl').value='';document.getElementById('imgFile').value='';uploadedBase64=null;document.getElementById('preview').style.display='none';}let currentKey=null;function search(){let q=document.getElementById('searchCode').value.toUpperCase().trim().replace("-","");let models=getModels();let r=models[q];if(!r){alert('Code not found');document.getElementById('found').style.display='none';return;}currentKey=q;document.getElementById('found').style.display='block';document.getElementById('fImg').src=r.img;document.getElementById('fName').innerText=r.name;document.getElementById('fCode').innerText=r.code+' - '+r.cat;document.getElementById('fVotes').innerText=r.votes;document.getElementById('fTotal').innerText=r.votes*25;}function addVotes(n){if(!currentKey){alert('Search first');return;}let models=getModels();models[currentKey].votes+=n;saveModels(models);document.getElementById('fVotes').innerText=models[currentKey].votes;document.getElementById('fTotal').innerText=models[currentKey].votes*25;alert('+ Added '+n+' votes ($'+(n*25)+') Total: '+models[currentKey].votes);render();}function addCustom(){let n=parseInt(document.getElementById('customVotes').value)||0;if(n<=0){alert('Enter qty');return;}addVotes(n);}function resetVotes(){if(!currentKey)return;if(!confirm('Reset to 0?'))return;let models=getModels();models[currentKey].votes=0;saveModels(models);document.getElementById('fVotes').innerText=0;document.getElementById('fTotal').innerText=0;render();}function deleteContestant(){if(!currentKey)return;if(!confirm('Delete this contestant?'))return;let models=getModels();delete models[currentKey];saveModels(models);document.getElementById('found').style.display='none';currentKey=null;render();alert('Deleted');}function render(){let models=getModels();let html='';for(let k in models){let m=models[k];html+=`<div class="card" style="display:flex;gap:10px"><img src="${m.img}" style="width:60px;height:60px;border-radius:4px"><div><p style="font-weight:700">${m.name}</p><p style="font-size:11px;opacity:.6">${m.code} - ${m.cat}</p><p style="font-size:12px;color:#d7b77a">${m.votes} VOTES - $${m.votes*25}</p></div></div>`;}document.getElementById('list').innerHTML=html||'<p style="opacity:.4">No contestants</p>';}render();</script></body></html>
