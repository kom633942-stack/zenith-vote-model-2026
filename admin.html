<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Zenith 2026</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff;padding:15px}
h1{text-align:center;color:#FFD700}
.card{background:#1e1e1e;padding:15px;border-radius:12px;margin-bottom:15px}
input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#2a2a2a;color:#fff}
button{padding:12px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-add{background:#FFD700;color:#000;width:100%;margin-top:10px}
.model-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.model-item{background:#2a2a2a;border-radius:10px;overflow:hidden;padding-bottom:8px;text-align:center}
.model-item img{width:100%;height:140px;object-fit:cover}
.btn-del{background:#ff4444;color:#fff;width:90%;margin-top:6px}
#status{text-align:center;color:#FFD700;margin:10px}
</style>
</head>
<body>
<h1>ZENITH ADMIN - AUTO SYNC</h1>
<p style="text-align:center;color:#aaa;font-size:13px">Add/Delete here = Updates instantly on client site.</p>
<div class="card">
<h3>Add New Model</h3>
<input type="text" id="modelName" placeholder="Model Name">
<label>Main Image</label>
<input type="file" id="mainImage" accept="image/*">
<label>Extra Slideshow Images (optional)</label>
<input type="file" id="extraImages" accept="image/*" multiple>
<button class="btn-add" onclick="addModel()">ADD MODEL - LIVE INSTANTLY</button>
<p id="status"></p>
</div>
<div class="card">
<h3>Existing Models (<span id="count">0</span>)</h3>
<div class="model-list" id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCah_ucdI55pyBR_RJ_ILu26aSALI1rVbA",
  authDomain: "zenith-2026-vote.firebaseapp.com",
  databaseURL: "https://zenith-2026-vote-default-rtdb.firebaseio.com",
  projectId: "zenith-2026-vote",
  storageBucket: "zenith-2026-vote.firebasestorage.app",
  messagingSenderId: "534661022606",
  appId: "1:534661022606:web:31af138277cf4e88ce9adf",
  measurementId: "G-ZTNEHT3KEX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

function fileToBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);})}

window.addModel=async()=>{
  const name=document.getElementById('modelName').value.trim();
  const mainFile=document.getElementById('mainImage').files[0];
  const extraFiles=document.getElementById('extraImages').files;
  const status=document.getElementById('status');
  if(!name||!mainFile){status.textContent='Enter name and main image';return;}
  status.textContent='Uploading...';
  try{
    const mainImage=await fileToBase64(mainFile);
    let extraImages=[];
    for(let f of extraFiles){extraImages.push(await fileToBase64(f));}
    const newRef=push(ref(db,'models'));
    await set(newRef,{name,mainImage,image:mainImage,extraImages,extra:extraImages,votes:0,created:Date.now()});
    status.textContent='✅ Added! Client sees it now!';
    document.getElementById('modelName').value='';document.getElementById('mainImage').value='';document.getElementById('extraImages').value='';
  }catch(e){status.textContent='Error: '+e.message;}
}

onValue(ref(db,'models'), snap=>{
  const list=document.getElementById('list');
  const count=document.getElementById('count');
  list.innerHTML='';
  const data=snap.val();
  if(!data){count.textContent='0';list.innerHTML='<p style="color:#888">No models</p>';return;}
  const entries=Object.entries(data);
  count.textContent=entries.length;
  entries.forEach(([id,m])=>{
    const div=document.createElement('div');
    div.className='model-item';
    div.innerHTML=`<img src="${m.mainImage||m.image}"><div style="padding:5px">${m.name}</div><button class="btn-del" onclick="deleteModel('${id}')">DELETE</button>`;
    list.appendChild(div);
  });
});

window.deleteModel=async(id)=>{
  if(!confirm('Delete this model? Client will no longer see it instantly.')) return;
  await remove(ref(db,'models/'+id));
}
</script>
</body>
</html>
