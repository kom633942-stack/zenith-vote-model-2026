<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith Admin Panel</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{background:#0e0e0e;color:#fff;margin:0}
.header{background:#000;padding:14px;text-align:center;border-bottom:1px solid #222}
.header b{color:#FFD700;letter-spacing:2px}
.tabs{display:flex;background:#181818;border-bottom:1px solid #222}
.tabs div{flex:1;text-align:center;padding:14px;cursor:pointer;font-size:13px;font-weight:700;color:#888}
.tabs div.active{color:#FFD700;border-bottom:2px solid #FFD700;background:#1f1f1f}
.tab{display:none;padding:16px} .tab.active{display:block}
.card{background:#1c1c1c;padding:16px;border-radius:14px;margin-bottom:16px;border:1px solid #222}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#2a2a2a;color:#fff}
label{font-size:12px;color:#999;margin-top:8px;display:block}
button{padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer}
.btn-gold{background:#FFD700;color:#000;width:100%;margin-top:10px}
.btn-del{background:#ff3b3b;color:#fff;padding:8px 12px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item{background:#252525;border-radius:12px;overflow:hidden;text-align:center;padding-bottom:10px;border:1px solid #2a2a2a}
.item img{width:100%;height:150px;object-fit:cover}
.vote-row{background:#252525;padding:12px;border-radius:10px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.vote-row img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.pending{background:#ffcc00;color:#000;padding:3px 8px;border-radius:12px;font-size:11px}
</style>
</head>
<body>
<div class="header"><b>ZENITH ADMIN - AUTOMATIC SYNC</b></div>
<div class="tabs">
<div id="t1" class="active" onclick="showTab(1)">ADD MODEL</div>
<div id="t2" onclick="showTab(2)">MODELS (<span id="mCount">0</span>)</div>
<div id="t3" onclick="showTab(3)">VOTES / GIFTS</div>
</div>
<div id="tab1" class="tab active">
<div class="card">
<h3>Add New Contestant</h3>
<input id="modelName" placeholder="Model Name">
<label>Main Photo</label>
<input id="mainImage" type="file" accept="image/*">
<label>Extra Photos (optional)</label>
<input id="extraImages" type="file" accept="image/*" multiple>
<button class="btn-gold" onclick="addModel()">ADD LIVE - CLIENT SEES INSTANTLY</button>
<p id="addStatus" style="text-align:center;color:#FFD700;margin-top:10px"></p>
</div>
</div>
<div id="tab2" class="tab"><div class="grid" id="modelGrid"></div></div>
<div id="tab3" class="tab"><div id="votesList"><p style="color:#666;text-align:center">Loading votes...</p></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCah_ucdI55pyBR_RJ_ILu26aSALI1rVbA",authDomain:"zenith-2026-vote.firebaseapp.com",databaseURL:"https://zenith-2026-vote-default-rtdb.firebaseio.com",projectId:"zenith-2026-vote",storageBucket:"zenith-2026-vote.firebasestorage.app",messagingSenderId:"534661022606",appId:"1:534661022606:web:31af138277cf4e88ce9adf",measurementId:"G-ZTNEHT3KEX"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
function toB64(f){return new Promise((r,j)=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.onerror=j;rd.readAsDataURL(f);});}
window.showTab=n=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tabs div').forEach(t=>t.classList.remove('active'));document.getElementById('tab'+n).classList.add('active');document.getElementById('t'+n).classList.add('active');};
window.addModel=async()=>{
 const name=document.getElementById('modelName').value.trim(); const main=document.getElementById('mainImage').files[0]; const extra=document.getElementById('extraImages').files; const st=document.getElementById('addStatus');
 if(!name||!main){st.textContent='Enter name + main photo';return;} st.textContent='Uploading...';
 try{const mainB=await toB64(main); let extras=[]; for(let f of extra) extras.push(await toB64(f)); const nr=push(ref(db,'models')); await set(nr,{name,mainImage:mainB,image:mainB,extraImages:extras,votes:0,created:Date.now()}); st.textContent='✅ LIVE! Client sees it now.'; document.getElementById('modelName').value='';}catch(e){st.textContent='Error: '+e.message;}
};
onValue(ref(db,'models'),snap=>{
 const grid=document.getElementById('modelGrid'); const count=document.getElementById('mCount'); grid.innerHTML=''; const data=snap.val(); if(!data){count.textContent='0';grid.innerHTML='<p style="color:#666">No models</p>';return;} const entries=Object.entries(data); count.textContent=entries.length; entries.forEach(([id,m])=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<img src="${m.mainImage||m.image}"><div style="padding:8px;font-size:13px">${m.name}<br><small style="color:#888">${m.votes||0} votes</small></div><button class="btn-del" onclick="delModel('${id}')">DELETE LIVE</button>`;grid.appendChild(div);});
});
window.delModel=async(id)=>{if(!confirm('Delete?'))return; await remove(ref(db,'models/'+id));};
onValue(ref(db,'votes'),snap=>{
 const list=document.getElementById('votesList'); const data=snap.val(); if(!data){list.innerHTML='<p style="color:#666;text-align:center">No votes yet</p>';return;} list.innerHTML=''; Object.entries(data).reverse().forEach(([id,v])=>{const div=document.createElement('div');div.className='vote-row';div.innerHTML=`<img src="${v.giftImage}"><div style="flex:1"><div style="font-size:13px;font-weight:700">${v.voterName} - ${v.voteCount} votes ($${v.total})</div><div style="font-size:11px;color:#888">Code: ${v.giftCode}</div><div style="font-size:10px;color:#666">${new Date(v.created).toLocaleString()}</div></div><div><span class="pending">${v.status||'pending'}</span></div>`;list.appendChild(div);});
});
</script>
</body>
</html>
