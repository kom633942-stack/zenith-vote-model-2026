<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title><style>body{background:#080508;color:#fff;font-family:sans-serif;padding:16px}input{background:#1a1a1a;border:1px solid #444;padding:12px;color:#fff;width:100%;margin-top:8px;border-radius:6px}button{background:#d7b77a;color:#000;padding:12px;border:0;border-radius:6px;font-weight:700;width:100%;margin-top:10px;cursor:pointer}.box{border:1px solid #333;padding:16px;border-radius:8px;background:#0f0d10;margin-top:16px}img{max-width:100%}</style></head><body><div id="login" style="max-width:360px;margin:80px auto;text-align:center;border:1px solid #d7b77a;padding:20px;border-radius:10px"><h3 style="color:#d7b77a;letter-spacing:.2em">ZENITH ADMIN</h3><input id="p" type="password" placeholder="Enter Password"><button onclick="go()">LOGIN</button></div><div id="panel" style="display:none;max-width:700px;margin:auto"><h3 style="color:#d7b77a">ZENITH ADMIN - $20 VOTE MANAGER</h3><div class="box"><h4>1. Add Contestant + Upload Photo From Device</h4><input id="nName" placeholder="Name e.g. SAYA WIFEY"><input id="nCode" placeholder="Code e.g. Saya463"><input id="nCat" placeholder="Category"><input id="nFile" type="file" accept="image/*" style="background:#222"><img id="preview" style="display:none;margin-top:10px;width:100%;height:200px;object-fit:cover;border-radius:6px"><input id="nVotes" type="number" value="0"><button onclick="add()">ADD MODEL WITH PHOTO</button></div><div class="box"><h4>2. Increase Votes After Payment (Manual) - $20 per vote</h4><input id="uCode" placeholder="Code e.g. Saya463"><input id="uAdd" type="number" placeholder="Votes to ADD e.g. 5"><button onclick="addVotes()">+ ADD VOTES BUTTON - CLICK HERE TO INCREASE</button></div><div class="box"><h4>3. Current Contestants</h4><div id="list"></div></div></div><script>const _p=atob("WmVuaXRoMjAyNg==");let tempImg="";document.getElementById('nFile').addEventListener('change',function(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){tempImg=ev.target.result;let pr=document.getElementById('preview');pr.src=tempImg;pr.style.display='block'};r.readAsDataURL(file)});function go(){if(document.getElementById('p').value===_p){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';render()}else alert('Wrong')}function getModels(){return JSON.parse(localStorage.getItem('zenith_models_v3')||'null')||{"SAYA463":{name:"SAYA WIFEY",code:"Saya463",cat:"Japanese - Runway Contestant",votes:0,img:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600"}}}function save(m){localStorage.setItem('zenith_models_v3',JSON.stringify(m));render()}function add(){let name=document.getElementById('nName').value;let code=document.getElementById('nCode').value;let cat=document.getElementById('nCat').value||'Contestant';let votes=parseInt(document.getElementById('nVotes').value)||0;if(!name||!code){alert('Need name and code');return}if(!tempImg){alert('Select photo');return}let m=getModels();m[code.toUpperCase().replace("-","")]={name:name,code:code,cat:cat,votes:votes,img:tempImg};save(m);alert('Added')}function addVotes(){let code=document.getElementById('uCode').value.toUpperCase().replace("-","");let add=parseInt(document.getElementById('uAdd').value)||0;let m=getModels();if(!m[code]){alert('Code not found');return}m[code].votes+=add;save(m);alert('Added '+add+' votes - Total '+m[code].votes)}function render(){let m=getModels();let h='';Object.values(m).forEach(v=>{h+=`<div style="border-top:1px solid #222;padding:10px 0;display:flex;gap:10px"><img src="${v.img}" style="width:50px;height:50px;object-fit:cover"><span><b style="color:#d7b77a">${v.code}</b> - ${v.name}<br>${v.votes} votes = $${v.votes*20}</span></div>`});document.getElementById('list').innerHTML=h}</script></body></html>
