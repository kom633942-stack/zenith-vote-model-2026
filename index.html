<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zenith Vote 2026</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@400&display=swap');
body{font-family:'Poppins',sans-serif;background:#07050a;color:#f5f0e8;margin:0}
.font-serif{font-family:'Cormorant Garamond',serif}
.top-bar{border:1px solid rgba(212,175,55,.6);border-left:4px solid #d4af37;border-right:4px solid #d4af37;background:rgba(15,10,20,.95)}
.gold-frame{padding:3px;background:linear-gradient(180deg,#d4af37,#8a6a1a,#f7e38a,#b8962f);border-radius:6px}
.gold-inner{background:#0a080f;border-radius:4px;overflow:hidden;position:relative}
.card-img{height:400px;position:relative;overflow:hidden}.card-img img{width:100%;height:100%;object-fit:cover}
.card-img:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent 60%)}
.card-content{position:absolute;bottom:0;left:0;right:0;padding:18px;text-align:center;z-index:3}
.btn-vote{background:linear-gradient(90deg,#b8962f,#f7e38a,#d4af37);color:#1a1200;font-weight:700;font-size:11px;padding:10px 22px;border-radius:4px;border:1px solid #d4af37}
.code-badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.7);border:1px solid #d4af37;color:#d4af37;font-size:10px;padding:4px 8px;border-radius:4px;z-index:4}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#0f0a14;border:1px solid #d4af37;border-radius:12px;padding:20px;max-width:380px;width:100%}
.inp{background:rgba(255,255,255,.08);border:1px solid rgba(212,175,55,.3);border-radius:6px;padding:12px;color:#fff;width:100%}
.search-bar{background:rgba(255,255,255,.06);border:1px solid rgba(212,175,55,.4);border-radius:10px;padding:12px 16px;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="max-w-[1280px] mx-auto px-3 pt-4">
<div class="top-bar flex justify-between items-center px-5 py-3"><div><i class="fa-solid fa-crown text-[#d4af37]"></i><span class="font-serif ml-2">ZENITH</span><span class="text-[10px] ml-3 opacity-60">$20 VOTE</span></div><div class="text-[10px] opacity-50">LIVE</div></div>
<div class="text-center pt-10 pb-6"><h1 class="font-serif text-[26px] md:text-[38px]" style="color:#f7e8c0">SEARCH CODE TO VOTE $20</h1><p class="text-[11px] opacity-60 mt-2">ENTER UNIQUE CODE • $20 PER VOTE • EMAIL PAY</p></div>
<div class="max-w-[600px] mx-auto mb-10"><div class="search-bar"><i class="fa-solid fa-magnifying-glass text-[#d4af37]"></i><input id="codeSearch" oninput="searchCode()" placeholder="Enter code e.g. ZEN001" class="bg-transparent w-full outline-none text-[13px]"><button onclick="searchCode()" class="text-[#d4af37] text-[11px]">SEARCH</button></div><p id="searchMsg" class="text-[11px] text-center mt-3 opacity-60">Static contestants • Search by code</p></div>
<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-6 px-2 md:px-8 pb-20"></div>
</div>
<div id="modal"><div class="modal-box"><h3 id="mName" class="font-serif text-[19px] text-[#f7e8c0] text-center"></h3><p id="mCode" class="text-[11px] text-center text-[#d4af37] tracking-widest mt-1"></p><div class="mt-5 space-y-3"><label class="text-[10px] opacity-70">YOUR EMAIL</label><input id="vEmail" class="inp" placeholder="e"><label class="text-[10px] opacity-70">VOTES ($20 each)</label><input id="vCount" type="number" value="5" min="1" class="inp" oninput="calc()"><p class="font-serif text-right text-[20px]" style="color:#c9a86a">TOTAL: $<span id="vTotal">100</span></p><button onclick="sendEmail()" class="w-full py-4 rounded font-bold text-[13px]" style="background:linear-gradient(90deg,#c9a86a,#e8d5a3);color:#000">CONTINUE TO PAY VIA EMAIL <i class="fa-solid fa-envelope ml-2"></i></button><button onclick="closeM()" class="w-full mt-2 text-[10px] opacity-50 underline">Cancel</button><p class="text-[9px] opacity-30 text-center mt-3">Redirects to Zenithmodeling1@outlook.com</p></div></div></div>
<script>
const PAY_EMAIL="Zenithmodeling1@outlook.com";
const PRICE=20;
const CONTESTANTS=[
{name:"SAYA WILSON",code:"ZEN001",photo:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600",votes:12400},
{name:"NOIR VALENTINE",code:"ZEN002",photo:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600",votes:9800},
{name:"AURELIA BLACK",code:"ZEN003",photo:"https://images.unsplash.com/photo-1534751516642-a1af1ef26a56?w=600",votes:11200}
];
let cur=null;
function render(list){let g=document.getElementById('grid');g.innerHTML='';if(!list.length){g.innerHTML='<p class="col-span-3 text-center opacity-50 py-10">No code found. Try ZEN001, ZEN002, ZEN003</p>';return}list.forEach(c=>{g.innerHTML+=`<div class="gold-frame"><div class="gold-inner"><div class="code-badge">${c.code}</div><div class="card-img"><img src="${c.photo}"><div class="card-content"><div class="font-serif text-[16px]" style="color:#f7e8c0">${c.name}</div><div class="text-[10px] opacity-50 mt-1">${c.code} • ${c.votes.toLocaleString()} VOTES</div><button onclick="openM('${c.code}')" class="btn-vote mt-3">VOTE ${c.code} - $20</button></div></div></div></div>`;});}
function searchCode(){let q=document.getElementById('codeSearch').value.toUpperCase().trim();let m=document.getElementById('searchMsg');if(!q){render(CONTESTANTS);m.innerText='Static contestants • Search by code';return}let f=CONTESTANTS.filter(c=>c.code.includes(q)||c.name.toUpperCase().includes(q));render(f);m.innerText=`Found ${f.length} for "${q}"`;}
function openM(code){cur=CONTESTANTS.find(c=>c.code===code);document.getElementById('mName').innerText=cur.name;document.getElementById('mCode').innerText=cur.code;document.getElementById('modal').style.display='flex';calc();}
function closeM(){document.getElementById('modal').style.display='none'}
function calc(){let n=parseInt(document.getElementById('vCount').value)||0;document.getElementById('vTotal').innerText=n*PRICE}
function sendEmail(){let email=document.getElementById('vEmail').value;let count=document.getElementById('vCount').value;if(!email){alert('Enter your email');return}let total=count*PRICE;let subject=encodeURIComponent(`PAID VOTE - ${cur.code} - ${cur.name} - ${count} Votes - $${total}`);let body=encodeURIComponent(`Zenith Paid Vote\n\nContestant: ${cur.name}\nUnique Code: ${cur.code}\nVoter Email: ${email}\nVotes: ${count}\nTotal: $${total} ($20 per vote)\n\nI have paid $${total} for ${count} votes for code ${cur.code}. Please confirm and add votes.\n\nPayment to: ${PAY_EMAIL}`);window.location.href=`mailto:${PAY_EMAIL}?subject=${subject}&body=${body}`;closeM();}
render(CONTESTANTS);
</script>
</body>
</html>
