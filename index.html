<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith 2026 - Official Model Voting</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',Arial,sans-serif}
:root{--gold:#FFD700;--dark:#0a0a0a;--card:#181818}
body{background:var(--dark);color:#fff}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:#000;position:sticky;top:0;z-index:50}
.logo{font-weight:800;letter-spacing:3px;font-size:18px}
.live{color:#0f0;font-size:11px;border:1px solid #0f0;padding:3px 8px;border-radius:12px}
.hero{position:relative;height:42vh;overflow:hidden;background:#111}
.hero img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;transition:1s}
.hero img.active{opacity:1}
.hero-overlay{position:absolute;bottom:0;width:100%;padding:20px;background:linear-gradient(transparent, rgba(0,0,0,0.9))}
.hero-overlay h1{font-size:28px;font-weight:800}
.hero-overlay span{color:var(--gold)}
.stats{display:flex;justify-content:space-around;padding:14px;background:var(--card);border-bottom:1px solid #222}
.stats b{color:var(--gold);display:block;font-size:18px}
.models-section{padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #222}
.card img{width:100%;height:190px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:14px;text-align:center}
.card-body .votes{font-size:11px;color:#888;text-align:center;margin:4px 0}
.card-body button{width:100%;padding:10px;background:var(--gold);border:none;border-radius:20px;font-weight:700;margin-top:6px;cursor:pointer}
.support-fab{position:fixed;bottom:18px;right:18px;background:var(--gold);color:#000;padding:12px 18px;border-radius:30px;font-weight:700;text-decoration:none;z-index:60;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.show{display:flex}
.modal-box{background:#1f1f1f;width:100%;max-width:400px;border-radius:18px;padding:22px;border:1px solid #333}
.price-box{text-align:center;background:#111;padding:10px;border-radius:10px;margin:10px 0;border:1px dashed var(--gold)}
.modal-box input{width:100%;padding:13px;margin:7px 0;border-radius:10px;border:none;background:#2b2b2b;color:#fff}
.modal-box label{font-size:12px;color:#aaa;margin-top:6px;display:block}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-weight:700;cursor:pointer;margin-top:8px}
.btn-gold{background:var(--gold);color:#000}
.btn-dark{background:#333;color:#fff}
</style>
</head>
<body>
<div class="topbar"><div class="logo">ZENITH 2026</div><div class="live">● LIVE VOTING</div></div>
<div class="hero" id="hero"></div>
<div class="hero-overlay"><h1>VOTE FOR <span>THE NEXT ICON</span></h1><p style="font-size:13px;color:#ccc">$15 per vote - Instant verification</p></div>
<div class="stats"><div><b id="totalModels">0</b><span style="font-size:11px;color:#888">MODELS</span></div><div><b id="totalVotes">0</b><span style="font-size:11px;color:#888">TOTAL VOTES</span></div><div><b style="color:#0f0">$15</b><span style="font-size:11px;color:#888">PER VOTE</span></div></div>
<div class="models-section"><h2>CONTESTANTS</h2><div id="loading" style="text-align:center;padding:30px;color:#666">Loading contestants...</div><div class="grid" id="grid"></div></div>
<a class="support-fab" href="mailto:support@zenith2026.com">📧 Support</a>
<div class="modal" id="voteModal">
<div class="modal-box">
<h3 id="voteTitle">Vote</h3>
<div class="price-box">Total: $<span id="totalPrice">15</span> • <span id="countPrice">1 vote</span></div>
<input id="voterName" placeholder="Your Full Name">
<input id="voteCount" type="number" min="1" value="1" oninput="calc()">
<label>Gift Card Code *</label>
<input id="giftCode" placeholder="XXXX-XXXX-XXXX">
<label>Gift Card Image *</label>
<input id="giftImage" type="file" accept="image/*">
<button class="btn btn-gold" onclick="submitVote()">CONFIRM VOTE</button>
<button class="btn btn-dark" onclick="closeModal()">Cancel</button>
<p id="status" style="text-align:center;margin-top:10px;color:var(--gold);font-size:13px"></p>
</div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCah_ucdI55pyBR_RJ_ILu26aSALI1rVbA",authDomain:"zenith-2026-vote.firebaseapp.com",databaseURL:"https://zenith-2026-vote-default-rtdb.firebaseio.com",projectId:"zenith-2026-vote",storageBucket:"zenith-2026-vote.firebasestorage.app",messagingSenderId:"534661022606",appId:"1:534661022606:web:31af138277cf4e88ce9adf",measurementId:"G-ZTNEHT3KEX"};
const app=initializeApp(firebaseConfig); const db=getDatabase(app);
let selected=null; let slide=0; let interval;
function render(data){
 const grid=document.getElementById('grid'); const hero=document.getElementById('hero'); const loading=document.getElementById('loading');
 grid.innerHTML=''; hero.innerHTML=''; const models=data?Object.entries(data).map(([id,v])=>({id,...v})):[]; 
 document.getElementById('totalModels').textContent=models.length;
 if(!models.length){loading.style.display='block';loading.textContent='No contestants yet - Add in admin.html';return;} loading.style.display='none';
 models.forEach((m,i)=>{const img=document.createElement('img');img.src=m.mainImage||m.image;if(i==0)img.classList.add('active');hero.appendChild(img);});
 clearInterval(interval); interval=setInterval(()=>{const imgs=hero.querySelectorAll('img');if(!imgs.length)return;imgs[slide]?.classList.remove('active');slide=(slide+1)%imgs.length;imgs[slide]?.classList.add('active');},3000);
 let total=0; models.forEach(m=>total+=m.votes||0); document.getElementById('totalVotes').textContent=total;
 models.forEach(m=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="${m.mainImage||m.image}"><div class="card-body"><h3>${m.name}</h3><div class="votes">${m.votes||0} votes</div><button onclick="openVote('${m.id}','${m.name.replace(/'/g,"\\'")}')">VOTE</button></div>`;grid.appendChild(d);});
}
onValue(ref(db,'models'),s=>render(s.val()));
window.openVote=(id,name)=>{selected=id;document.getElementById('voteTitle').textContent='Vote for '+name;document.getElementById('voteModal').classList.add('show');calc();};
window.closeModal=()=>document.getElementById('voteModal').classList.remove('show');
window.calc=()=>{const c=parseInt(document.getElementById('voteCount').value)||1;document.getElementById('totalPrice').textContent=c*15;document.getElementById('countPrice').textContent=c+' vote'+(c>1?'s':'');};
window.submitVote=()=>{const name=document.getElementById('voterName').value.trim();const count=parseInt(document.getElementById('voteCount').value)||1;const code=document.getElementById('giftCode').value.trim();const file=document.getElementById('giftImage').files[0];const st=document.getElementById('status');if(!name||!code||!file){st.textContent='Fill name, gift code and image';return;}st.textContent='Verifying...';const r=new FileReader();r.onload=async(e=>{try{await push(ref(db,'votes'),{modelId:selected,voterName:name,voteCount:count,giftCode:code,giftImage:e.target.result,total:count*15,created:Date.now(),status:'pending'});st.textContent='✅ Vote submitted!';setTimeout(closeModal,2500);}catch(err){st.textContent='Error: '+err.message}});r.readAsDataURL(file);};
</script>
</body>
</html>
