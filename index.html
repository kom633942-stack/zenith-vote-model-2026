<!DOCTYPE html>

<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith Vote Model 2026</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Poppins:wght@300;400;500&display=swap');
body{font-family:'Poppins',sans-serif;background:#050307;color:#f5f0e8;margin:0;overflow-x:hidden}
.font-serif{font-family:'Cormorant Garamond',serif}
.top-bar{border:1px solid rgba(212,175,55,0.6);border-left:4px solid #d4af37;border-right:4px solid #d4af37;background:linear-gradient(90deg, rgba(15,10,20,0.95), rgba(25,15,30,0.9));box-shadow:0 0 0 1px rgba(212,175,55,0.15) inset, 0 10px 40px rgba(0,0,0,0.6);backdrop-filter:blur(16px)}
.bottom-bar{border:1px solid rgba(212,175,55,0.5);background:linear-gradient(90deg, rgba(15,10,20,0.9), rgba(25,15,30,0.9));backdrop-filter:blur(12px)}
.gold-frame{position:relative;padding:3px;background:linear-gradient(180deg, #d4af37, #8a6a1a, #f7e38a, #b8962f);border-radius:6px;box-shadow:0 0 30px rgba(212,175,55,0.25)}
.gold-frame-inner{background:#0a080f;border-radius:4px;position:relative;overflow:hidden;padding:3px}
.gold-frame-inner:before{content:'';position:absolute;inset:8px;border:1px solid rgba(212,175,55,0.35);border-radius:3px;pointer-events:none;z-index:2}
.card-img{height:420px;position:relative;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img:after{content:'';position:absolute;inset:0;background:linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.2) 50%, transparent 100%)}
.card-content{position:absolute;bottom:0;left:0;right:0;padding:22px 16px 18px;text-align:center;z-index:3}
.card-name{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:0.04em;color:#f7e8c0;text-transform:uppercase;font-weight:600}
.card-votes{font-size:11px;letter-spacing:0.12em;opacity:0.7;margin-top:2px}
.btn-vote{background:linear-gradient(90deg, #b8962f, #f7e38a, #d4af37, #b8962f);color:#1a1200;font-weight:700;font-size:12px;letter-spacing:0.08em;padding:10px 28px;border-radius:4px;border:1px solid #d4af37;box-shadow:0 4px 18px rgba(212,175,55,0.35);text-transform:uppercase}
.purple-glow{position:absolute;width:120px;height:200px;background:radial-gradient(ellipse, rgba(168,85,247,0.5), transparent 70%);filter:blur(12px);pointer-events:none;z-index:1}
</style>
</head>
